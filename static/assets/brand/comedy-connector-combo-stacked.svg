<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300" role="img" aria-labelledby="cc-combo-stacked-title cc-combo-stacked-desc">
  <title id="cc-combo-stacked-title">Comedy Connector</title>
  <desc id="cc-combo-stacked-desc">Two interlocking C brush-strokes in teal and red inside a hand-drawn ring, stacked above the hand-lettered wordmark "Comedy Connector".</desc>

  <!-- Icon mark: faithful reuse of static/assets/brand/comedy-connector-mark.svg -->
  <g transform="translate(30 8) scale(1)">
    <path d="M185,100 172,130 164,164 131,176 100,188 69,174 35,165 22,132 21,100 18,66 41,41 65,16 100,20 133,21 164,36 175,69 Z"
          fill="none" stroke="#D93B2B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 138 62 C 95 40, 40 55, 32 100 C 25 145, 70 168, 118 150"
          stroke="#2E7D7D" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 92 138 C 135 160, 190 145, 198 100 C 205 55, 160 32, 112 50"
          stroke="#D93B2B" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: hand-lettered, slight jitter/rotation per word for an inked, unpolished feel -->
  <g fill="#1C1C1C" font-family="'Permanent Marker', cursive" font-weight="400" text-anchor="middle">
    <text x="130" y="248" font-size="42" transform="rotate(-1.5 130 248)">Comedy</text>
    <text x="130" y="290" font-size="42" transform="rotate(1 130 290)">Connector</text>
  </g>
</svg>
